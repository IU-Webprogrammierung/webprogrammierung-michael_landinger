<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <!-- Workaround um FOUC zu verhindern -->
    <script src="js/theme-init.js" defer></script>
    <title>Kontakt</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons&display=swap" media="print"
        onload="this.media='all'">
    <noscript>
        <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons&display=swap">
    </noscript>

    <link rel="icon" type="image/x-icon" href="assets/favicon/favicon.ico">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon/favicon-16x16.webp">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon/favicon-32x32.webp">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/favicon/apple-touch-icon.webp">

    <!-- Java script -->
    <script src="js/navigation.js" defer></script>
    <script src="js/backToTop.js" defer></script>
    <script src="js/theme-toggle.js" defer></script>
</head>

<body>
    <header>
        <!-- Navigation wird hier per JavaScript eingefügt -->
    </header>
    <main>
        <h1>Kontakt</h1>
        <section">
            <h2>Kontaktformular</h2>
            <form id="kontaktformular" method="get">
                <fieldset class="form-field">
                    <legend>Vorname</legend>
                    <input type="text" id="vorname" name="vorname" placeholder="Vorname" required />
                </fieldset>
                <fieldset class="form-field">
                    <legend>Name</legend>
                    <input type="text" id="name" name="name" placeholder="Name" required />
                </fieldset>
                <fieldset class="form-field">
                    <legend>E-Mail</legend>
                    <input type="email" id="email" name="email" placeholder="example@email.com" required />
                </fieldset>
                <fieldset class="form-field">
                    <legend>Telefon</legend>
                    <input type="tel" id="telefonnummer" name="telefonnummer" placeholder="+49 12345" required />
                </fieldset>
                <fieldset class="form-field full">
                    <legend>Betreff</legend>
                    <input type="text" id="betreff" name="betreff" placeholder="Betreff" required />
                </fieldset>
                <fieldset class="form-field full">
                    <legend>Nachricht</legend>
                    <textarea id="nachricht" name="nachricht" rows="5" cols="33" required></textarea>
                </fieldset>
                <div class="form-field full">
                    <button class="btn red" type="submit">Absenden</button>
                </div>
            </form>
        </section>
    </main>
    <!-- Footer wird hier per JavaScript eingefügt -->
</body>

</html>
