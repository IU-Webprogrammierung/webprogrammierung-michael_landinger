<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <!-- Workaround um FOUC zu verhindern -->
    <script src="js/theme-init.js"></script>
    <title>Unterkünfte</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons|Material+Icons+Outlined&display=swap" media="print"
        onload="this.media='all'">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" media="print"
        onload="this.media='all'">
    <noscript>
        <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons|Material+Icons+Outlined&display=swap">
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap">
    </noscript>

    <link rel="icon" type="image/x-icon" href="assets/favicon/favicon.ico">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon/favicon-16x16.webp">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon/favicon-32x32.webp">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/favicon/apple-touch-icon.webp">

    <!-- Java script -->
    <script src="js/navigation.js" defer></script>
    <script src="js/lightbox.js" defer></script>
    <script src="js/backToTop.js" defer></script>
    <script src="js/theme-toggle.js" defer></script>
    <script src="js/scrollAnimation.js" defer></script>
</head>

<body>
    <header>
        <!-- Navigation wird hier per JavaScript eingefügt -->
    </header>
    <main>
        <h1>Unterkünfte</h1>
        <article class="row">
            <figure class="image">
                <img srcset="images/accomodations/villa_kroatien-400.webp 400w,
                             images/accomodations/villa_kroatien-800.webp 800w,
                             images/accomodations/villa_kroatien-1200.webp 1200w"
                    sizes="(max-width: 768px) 100vw, (max-width: 1024px) 50vw, 40vw" 
                    src="images/accomodations/villa_kroatien-800.webp"
                    loading="lazy"
                    alt="Das Bild zeigt den Sonnenuntergang vom 1. Stock der Unterkunft. Dabei ist auch der Pool, sowie Teile des Hauses zu sehen. Der Pool ist schön beleuchtet.">
                <figcaption>Moderne Villa mit Pool bei Novigrad, Kroatien</figcaption>
            </figure>
            <div class="text">
                <h2>Villa für 8 Personen bei Novigrad, Kroatien</h2>
                <p>Moderne Villa etwas außerhalb der Stadt. Ideal für Gruppen.</p>
            </div>
        </article>

        <article class="row reverse">
            <figure class="image">
                <img srcset="images/accomodations/haus_norderney-400.webp 400w,
                             images/accomodations/haus_norderney-800.webp 800w,
                             images/accomodations/haus_norderney-1200.webp 1200w"
                    sizes="(max-width: 768px) 100vw, (max-width: 1024px) 50vw, 40vw" 
                    src="images/accomodations/haus_norderney-800.webp"
                    loading="lazy"
                    alt="Das Bild zeigt ein mehrstöckiges Hochhaus auf Norderney bei bewölktem Himmel. Dabei sind Balkone mit teilweise Strandkörben darauf zu sehen. ">
                <figcaption>Hochhaus mit Meerblick auf Norderney</figcaption>
            </figure>
            <div class="text">
                <h2>Zimmer im Hochhaus auf Noderney</h2>
                <p>Gemütliche Zimmer in Strandnähe, ideal für Paare und kleine Familien.</p>
            </div>
        </article>
    </main>
    <!-- Footer wird hier per JavaScript eingefügt -->
</body>

</html>
